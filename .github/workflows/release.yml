name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  check:
    # A manual run from another branch must not publish that branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.gate.outputs.version }}
      release: ${{ steps.gate.outputs.release }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
      - id: gate
        run: bash .github/scripts/release-version.sh check >> "$GITHUB_OUTPUT"

  # test, lint and package are the same commands as ci.yml. They run apart from
  # publish so that the project's own code never executes in a job holding the
  # OIDC permission.
  test:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.3", "3.4"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake test

  lint:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rake rubocop
      - run: bundle exec rake signatures

  package:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: gem build fingerly.gemspec
      - name: no runtime dependencies
        run: |
          ruby -rrubygems/package -e '
            spec = Gem::Package.new(Dir["fingerly-*.gem"].fetch(0)).spec
            unless spec.runtime_dependencies.empty?
              abort("the gem declares runtime dependencies: #{spec.runtime_dependencies}")
            end
            unless spec.required_ruby_version.to_s.include?(">= 3.2")
              abort("the supported Ruby floor moved: #{spec.required_ruby_version}")
            end
            host = spec.metadata["allowed_push_host"]
            abort("allowed_push_host is #{host.inspect}") unless host == "https://rubygems.org"
            puts "gem declares no runtime dependencies"
          '

  publish:
    needs: [check, test, lint, package]
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
      - run: bash .github/scripts/release-version.sh consistency
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      # Trusted publishing, done by hand: rubygems/release-gem v1.4.1 cannot pass
      # the `owner` RubyGems needs before a pending publisher may create the gem.
      # RUBYGEMS_OWNER is the owning account's numeric ID from its Pending
      # Trusted Publishers page; an ID, unlike a handle, cannot be re-registered.
      - name: exchange the OIDC token for a RubyGems key
        env:
          OWNER: ${{ vars.RUBYGEMS_OWNER }}
        run: |
          if [ -z "$OWNER" ]; then
            echo "::error::set the RUBYGEMS_OWNER repository variable"; exit 1
          fi
          jwt=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=rubygems.org" | jq -r .value)
          body=$(jq -n --arg jwt "$jwt" --arg owner "$OWNER" '{jwt: $jwt, owner: $owner}' \
            | curl -sS -X POST -H "Content-Type: application/json" --data @- \
              https://rubygems.org/api/v1/oidc/trusted_publisher/exchange_token)
          key=$(printf '%s' "$body" | jq -r '.rubygems_api_key // empty' 2>/dev/null || true)
          if [ -z "$key" ]; then
            # A failed exchange carries no key, so its body is safe to print.
            echo "::error::RubyGems did not return a key: $body"; exit 1
          fi
          echo "::add-mask::$key"
          echo "GEM_HOST_API_KEY=$key" >> "$GITHUB_ENV"
      # `rake release` is build and push only, see the Rakefile.
      - run: bundle exec rake release
      - name: tag and release
        run: gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
