name: Ruby SDK
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.2 is the floor the gemspec declares; the rest guard against drift
        # on anything newer a customer is likely to be on.
        ruby: ["3.2", "3.3", "3.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rake rubocop
      # rbs validate proves the signatures are consistent; rake test's
      # signatures case proves they describe the library that exists.
      - run: bundle exec rake signatures

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: gem build fingerly.gemspec
      # The standard library is all this gem is allowed to need. Java checks
      # its bytecode version here and .NET its dependency groups; for Ruby the
      # equivalent is that the built gem declares nothing at run time.
      - name: no runtime dependencies
        run: |
          ruby -rrubygems/package -e '
            spec = Gem::Package.new("fingerly-0.1.0.gem").spec
            unless spec.runtime_dependencies.empty?
              abort("the gem declares runtime dependencies: #{spec.runtime_dependencies}")
            end
            unless spec.required_ruby_version.to_s.include?(">= 3.2")
              abort("the supported Ruby floor moved: #{spec.required_ruby_version}")
            end
            # Nothing is published yet; a private SDK reaching RubyGems is not
            # a mistake anybody can take back.
            host = spec.metadata["allowed_push_host"]
            abort("allowed_push_host is #{host.inspect}") if host.to_s.include?("rubygems.org")
            puts "gem declares no runtime dependencies"
          '
      - uses: actions/upload-artifact@v4
        with:
          name: fingerly-gem
          path: "*.gem"
